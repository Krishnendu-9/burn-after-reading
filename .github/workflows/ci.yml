name: CI

on:
  push:
  pull_request:
  # New advisories are published whether or not anyone pushes. A weekly run
  # surfaces them on a quiet repo instead of on the next unrelated PR.
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      # Let both versions finish, so a failure on one shows whether the other passes.
      fail-fast: false
      matrix:
        # 22: what the Dockerfile ships and the floor package.json declares.
        # 24: the current LTS. better-sqlite3 is a native module (N-API since
        #     v13), so a Node major is still the change most likely to break it.
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # --ignore-scripts as in the Dockerfile: Node 22's npm 10 would otherwise
      # compile better-sqlite3 from source despite its bundled binaries.
      - name: Install from the lockfile
        run: npm ci --ignore-scripts

      # Also builds the front end first (the pretest script): the pages read
      # Vite's manifest from public/dist, which is not in git.
      - name: Build and run tests
        run: npm test
        env:
          # npm test itself is unchanged. These add a second reporter that
          # records which file each test came from, next to the usual output.
          NODE_OPTIONS: >-
            --test-reporter=spec --test-reporter-destination=stdout
            --test-reporter=./.github/ci/test-file-reporter.mjs
            --test-reporter-destination=test-run.json

      # Runs after a test failure too, so the log shows which file broke.
      - name: Verify every test file ran
        if: ${{ !cancelled() }}
        run: node .github/ci/check-test-run.mjs test-run.json test

  # Its own job: lint results don't depend on the Node version, so running it
  # in the test matrix would only repeat it, and a lint failure stays visible
  # separately from test results.
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install from the lockfile
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

  # The tests run with every dependency installed; the image installs
  # production dependencies only and copies a subset of the files. This is the
  # one place that starts the app the way production does, so a runtime import
  # left in devDependencies, a file .dockerignore drops, or a broken HEALTHCHECK
  # fails here instead of on the server. Nothing is pushed.
  docker:
    name: Docker image (build and smoke test)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the image
        run: docker build --tag burn-after-reading:ci .

      # A throwaway key that exists only for this run. The health check runs
      # every 2 s here instead of 30 s, so its result is known quickly.
      - name: Start it with a throwaway key
        run: |
          docker run --detach --name smoke --publish 3000:3000 \
            --env SECRET_KEY="$(openssl rand -hex 32)" \
            --env BASE_URL=http://localhost:3000 \
            --health-interval 2s --health-start-period 5s \
            burn-after-reading:ci

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: "Smoke test: health, create a secret, reveal it once"
        run: node .github/ci/smoke-test.mjs http://localhost:3000

      - name: The image's own health check passes, and it runs as node
        run: |
          for i in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' smoke)
            [ "$status" = healthy ] && break
            sleep 1
          done
          echo "HEALTHCHECK status: $status"
          [ "$status" = healthy ]
          [ "$(docker exec smoke id -un)" = node ]

      - name: Container logs
        if: ${{ !cancelled() }}
        run: docker logs smoke

  audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # npm audit reads package-lock.json; it does not need node_modules.

      # What ships in the Docker image (npm ci --omit=dev) and handles every
      # request. The tree is small, so moderate rarely means noise here.
      - name: Audit runtime dependencies (fail on moderate or above)
        run: npm audit --omit=dev --audit-level=moderate

      # Build tooling never reaches production, and most of its advisories are
      # about vite's dev server, which this project does not run. Only critical
      # (code execution, known malware) fails the build here.
      - name: Audit all dependencies including dev (fail on critical)
        if: ${{ !cancelled() }}
        run: npm audit --audit-level=critical
